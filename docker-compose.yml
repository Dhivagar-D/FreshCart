
services:
  mongo:
    image: mongo:7
    container_name: freshcart-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - freshcart-mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: freshcart-server
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173,http://localhost:5174,http://192.168.56.1:5173
      MONGO_URI: mongodb://mongo:27017/freshcart
    ports:
      - "5001:5000"
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: freshcart-client
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
    ports:
      - "5174:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  freshcart-mongo-data:
