services:
  - type: web
    name: freshcart
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_EPHEMERAL_DB
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: INITIALIZE_EMPTY_DATABASE
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COMMISSION_PERCENT
        value: "5"
      - key: MAX_DISTANCE_METERS
        value: "20000"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
